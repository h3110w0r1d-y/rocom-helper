services:
  roco-helper:
    image: h3110w0r1d6/roco-helper:latest
    container_name: roco-helper
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - ROCO_IFACE=eth0
      - ROCO_BIND=0.0.0.0
      - ROCO_PORT=4939
      - ROCO_DATA_DIR=/data
      - ROCO_TLS=false
      # - ROCO_FILTER_HOST=192.168.0.1 # 解决单臂路由捕获双份流量的问题
    volumes:
      - ./data:/data
